name: invoiceninja
# Display-only (the store orders releases by revision, not this string). Kept
# in sync with pubspec MAJOR.MINOR.PATCH by tools/bump_client_version.sh —
# don't hand-edit. (adopt-info can't help here: the part is a `dump` of the
# built bundle, so pubspec.yaml isn't in the part source.)
version: '5.1.25'
summary: Create invoices, accept payments, track expenses & time tasks
description: |
  Create. Send. Get Paid.

  Invoice Ninja is a leading platform for SMB's to invoice, accept payments, track expenses & time billable-tasks. Designed for freelancers and small to medium size businesses, Invoice Ninja is a suite of apps to help you get paid.

  • Incredibly easy to use
  Invoice Ninja was built to serve freelancers and business owners with a complete suite of invoicing & payment tools to advance your business.

  • Invoicing & Payments
  Every feature is geared towards accurate and secure invoicing and getting you paid. With Invoice Ninja you can send beautiful branded invoices with minimum of effort and maximum professionalism.

  • Time Tracker & Projects
  Create projects and individual tasks per project. When done, simply "Send task to invoice" and all details will be sent ready for your clients to pay!

  • Track Vendors & Expenses
  With Invoice Ninja, all your earnings, expenses, clients and vendors are stored and managed in one system. Categorize your vendors & re-invoice expenses to clients, or simply run expense reports.

  All of these features combine to help you receive the money you deserve and reduce the amount of time you spend on repetitive invoicing tasks. Spend less time on paperwork and more time at your craft.
confinement: strict
base: core22
# stable grade lets a tested `edge` revision be promoted to `stable` as it is
# (`snapcraft release invoiceninja <rev> stable`). The workflow itself still
# releases only to edge (snapcraft.yml); `stable` is where v1's users are, so
# promoting replaces v1 for all of them (docs/going-live.md § Snap).
grade: stable

apps:
  invoiceninja:
    # Must match BINARY_NAME in linux/CMakeLists.txt (the Flutter binary is named
    # after the pubspec `name: admin`). snapd's command wrapper is still
    # `invoiceninja` (the apps key), which is what the .desktop Exec points at.
    command: admin
    # Sets SECRET_BACKEND=file while password-manager-service is unconnected, so
    # the database key goes through the desktop's Secret portal instead of the
    # host keyring AppArmor blocks (the script says why). docs/setup.md.
    command-chain: [bin/keyring-backend]
    # Provides desktop/desktop-legacy/wayland/x11/gsettings/opengl + the GTK runtime.
    extensions: [gnome]
    plugs:
      - network
      - home
      # The host Secret Service (gnome-keyring / KWallet), for the SQLCipher
      # DB key. OPTIONAL and NOT auto-connected: the key normally goes through
      # the Secret portal (bin/keyring-backend). Only a desktop with no Secret
      # portal needs `snap connect invoiceninja:password-manager-service`,
      # which is what the app's keyring screen asks for. See docs/setup.md.
      - password-manager-service
      # NetworkManager (system D-Bus) access for connectivity_plus's online/
      # offline detection. OPTIONAL, NOT auto-connected, and NOT load-bearing:
      # ConnectivityWatcher degrades to "assume online" when it's absent, so
      # saves and syncing work without it (see connectivity_watcher.dart).
      # Connecting it (`snap connect invoiceninja:network-manager`) only enables
      # the offline banner + auto-drain-on-reconnect. See docs/setup.md.
      - network-manager

parts:
  invoiceninja:
    # The Linux bundle is compiled by the GitHub Action (flutter build linux)
    # before snapcraft runs; this part only stages the prebuilt bundle, so there
    # are no build-packages here — the Linux build deps live in the workflow.
    source: build/linux/x64/release/bundle
    plugin: dump
    stage-packages:
      # Runtime for flutter_secure_storage_linux (the plugin docs prescribe staging it).
      # core22's 0.20.5 is the first libsecret that uses the portal in a snap.
      - libsecret-1-0
  launcher:
    # The command-chain script above; snap/local is snapcraft's place for it.
    source: snap/local
    plugin: dump
    organize:
      keyring-backend: bin/keyring-backend
