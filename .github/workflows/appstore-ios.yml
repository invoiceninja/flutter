name: Deploy to TestFlight (iOS)

# Manual only — building + uploading a signed .ipa is a deliberate release
# action, not a per-push gate. Mirrors playstore.yml / snapcraft.yml. Uploads to
# TestFlight (the testing channel), the Apple analogue of the snap's `edge` and
# Play's `internal`: testers get it automatically, NOTHING is submitted for App
# Store review. Promote to App Store review by hand in App Store Connect.
on:
  workflow_dispatch:

# Least privilege: this job only checks out code, builds, and uploads to an
# external store. It never writes back to the repo.
permissions:
  contents: read

jobs:
  # Test gate. CI (.github/workflows/ci.yaml) is workflow_dispatch-only, so
  # without this a release could be built and uploaded without the suite ever
  # having run. Runs on Linux regardless of this workflow's runner — see
  # _test.yaml. Adds ~8-12 min to a release dispatch; that's the price of not
  # shipping a red suite to testers.
  test:
    uses: ./.github/workflows/_test.yaml

  deploy-ios:
    needs: test
    name: Build and Upload iOS to TestFlight
    # Same runner + Xcode select as the CI `apple` job. 10x-billed macOS minutes,
    # but a release dispatch is deliberate and infrequent.
    runs-on: macos-26
    timeout-minutes: 80
    # Job-level, not just on the --config-only step: `xcodebuild archive`
    # runs the Runner scheme's pre-action (tools/xcode_inject_sentry_dsn.sh),
    # which re-resolves both values from the environment (then dev.json, absent
    # here) and patches them into the generated xcconfig the compile reads.
    # With neither set it used to DROP the entries --config-only had written,
    # so every CI archive shipped with Sentry off and no Google client ID.
    env:
      IN_SENTRY_DSN: ${{ secrets.IN_SENTRY_DSN }}
      IN_GOOGLE_IOS_CLIENT_ID: ${{ secrets.IN_GOOGLE_IOS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v5

      # Pinned to match ci.yaml / playstore.yml / snapcraft.yml.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      # Same Xcode the CI `apple` job pins — don't let a runner-image default
      # silently change the toolchain a shipped release is built with.
      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Import the Apple Distribution cert (+ private key) into a TEMPORARY
      # keychain (default `signing_temp`, auto-unlocked + on the search list —
      # avoids the headless "user interaction is not allowed" codesign failure).
      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}

      # Install the App Store profile for com.invoiceninja.admin. It MUST embed
      # the cert above AND the Sign in with Apple capability, or export fails.
      # Mirrors the Android keystore-from-base64 injection: CI holds zero signing
      # material until here; the decoded profile is wiped at the end.
      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${PROFILE_BASE64:-}" ]; then
            echo "::error::IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 is empty — cannot sign for the App Store." >&2
            exit 1
          fi
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_DIR/appstore.mobileprovision"

      # --config-only writes the build settings (incl. the IN_SENTRY_DSN
      # dart-define, baked into the AOT binary at compile time) WITHOUT building,
      # so we can drive a MANUAL-signed archive ourselves. `flutter build ipa`
      # would do archive+export in one shot using the project's AUTOMATIC signing
      # for the archive — which fails on a headless runner with no Apple-account
      # session (the manual ExportOptions only governs the export re-sign, not the
      # archive). Empty/unset DSN secret is a safe no-op (Sentry stays disabled),
      # and an unset IN_GOOGLE_IOS_CLIENT_ID hides "Sign in with Google"
      # (docs/setup.md § Google Sign-In client IDs).
      - name: Configure iOS release build
        run: >-
          flutter build ios --release --config-only
          --dart-define=IN_SENTRY_DSN="$IN_SENTRY_DSN"
          --dart-define=IN_GOOGLE_IOS_CLIENT_ID="$IN_GOOGLE_IOS_CLIENT_ID"

      # Google Sign-In on iOS needs the client ID's REVERSED form registered as
      # a URL scheme, or the SDK throws before showing the account chooser. The
      # client ID is a secret here and not committed, so the scheme is added to
      # ios/Runner/Info.plist on the runner (idempotent — a scheme already
      # committed is left alone). Committing it is still the preferred fix, and
      # the only one a local Product → Archive gets (docs/setup.md § Google
      # Sign-In client IDs). Unset secret = Google stays hidden = nothing to add.
      - name: Register the Google Sign-In URL scheme
        run: |
          set -euo pipefail
          if [ -z "${IN_GOOGLE_IOS_CLIENT_ID:-}" ]; then
            echo "IN_GOOGLE_IOS_CLIENT_ID is not set — Sign in with Google stays hidden; no URL scheme needed."
            exit 0
          fi
          suffix=".apps.googleusercontent.com"
          prefix="${IN_GOOGLE_IOS_CLIENT_ID%"$suffix"}"
          if [ "$prefix" = "$IN_GOOGLE_IOS_CLIENT_ID" ] || [ -z "$prefix" ]; then
            echo "::error::IN_GOOGLE_IOS_CLIENT_ID must be an iOS OAuth client ID ending in $suffix." >&2
            exit 1
          fi
          scheme="com.googleusercontent.apps.$prefix"
          plist=ios/Runner/Info.plist
          pb=/usr/libexec/PlistBuddy
          if plutil -extract CFBundleURLTypes json -o - "$plist" 2>/dev/null | grep -qF "\"$scheme\""; then
            echo "The Google Sign-In URL scheme is already registered."
            exit 0
          fi
          if ! "$pb" -c "Print :CFBundleURLTypes" "$plist" >/dev/null 2>&1; then
            "$pb" -c "Add :CFBundleURLTypes array" "$plist"
          fi
          i=0
          while "$pb" -c "Print :CFBundleURLTypes:$i" "$plist" >/dev/null 2>&1; do
            i=$((i + 1))
          done
          "$pb" -c "Add :CFBundleURLTypes:$i dict" "$plist"
          "$pb" -c "Add :CFBundleURLTypes:$i:CFBundleURLName string com.invoiceninja.google-sign-in" "$plist"
          "$pb" -c "Add :CFBundleURLTypes:$i:CFBundleURLSchemes array" "$plist"
          "$pb" -c "Add :CFBundleURLTypes:$i:CFBundleURLSchemes:0 string $scheme" "$plist"
          echo "Registered the Google Sign-In URL scheme as CFBundleURLTypes[$i]."

      # Guard: a build that shows "Sign in with Google" (the secret is set) but
      # has no reversed-client-ID scheme crashes on the first tap.
      - name: Check the Google Sign-In URL scheme
        run: |
          set -euo pipefail
          if [ -z "${IN_GOOGLE_IOS_CLIENT_ID:-}" ]; then exit 0; fi
          scheme="com.googleusercontent.apps.${IN_GOOGLE_IOS_CLIENT_ID%.apps.googleusercontent.com}"
          if ! plutil -extract CFBundleURLTypes json -o - ios/Runner/Info.plist | grep -qF "\"$scheme\""; then
            echo "::error::IN_GOOGLE_IOS_CLIENT_ID is set but ios/Runner/Info.plist has no $scheme URL scheme — Sign in with Google would fail." >&2
            exit 1
          fi

      # Archive with MANUAL signing overrides on the command line so the tracked
      # pbxproj (Automatic / "Apple Development") is untouched. No
      # -allowProvisioningUpdates: its ABSENCE means xcodebuild never phones home
      # and uses exactly the injected cert + profile.
      - name: Archive iOS app (signed for distribution)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=NPC44Y2C98 \
            PROVISIONING_PROFILE_SPECIFIER="Invoice Ninja Admin App Store"

      # Prove the compile-time values reached the shipped binary. The pre-action
      # above is exactly the kind of thing that drops them silently (it did),
      # and a TestFlight build without the DSN reports nothing. The xcconfig
      # decode is a quick pointed diagnosis (what the compile was handed); the
      # binary grep is the authoritative check (a Dart string constant is stored
      # verbatim in the AOT snapshot). Skipped when a secret is unset.
      - name: Verify compile-time values in the archived binary
        run: |
          set -euo pipefail
          archive=build/ios/archive/Runner.xcarchive
          app_bin=$(find "$archive/Products/Applications" -path '*/App.framework/App' \( -type f -o -type l \) | head -n1)
          if [ -z "$app_bin" ]; then
            echo "::error::No App.framework/App in $archive." >&2
            exit 1
          fi
          defines=$(grep -E '^DART_DEFINES=' ios/Flutter/Generated.xcconfig | head -n1 | sed 's/^DART_DEFINES=//' || true)
          decoded=""
          IFS=',' read -ra entries <<< "$defines"
          for e in ${entries[@]+"${entries[@]}"}; do
            decoded="$decoded$(printf '%s' "$e" | /usr/bin/base64 -D 2>/dev/null || true)"$'\n'
          done
          for key in IN_SENTRY_DSN IN_GOOGLE_IOS_CLIENT_ID; do
            value="${!key:-}"
            if [ -z "$value" ]; then
              echo "$key is not set — nothing to verify."
              continue
            fi
            if ! printf '%s' "$decoded" | grep -qxF -- "$key=$value"; then
              echo "::warning::$key is missing from DART_DEFINES in ios/Flutter/Generated.xcconfig."
            fi
            if ! grep -qaF -- "$value" "$app_bin"; then
              echo "::error::$key is set but not in the archived $app_bin — the build would ship without it." >&2
              exit 1
            fi
            echo "$key is in the archived binary."
          done

      # Export a signed App Store .ipa via the committed secret-free
      # ios/ExportOptions.plist (method=app-store, signingStyle=manual, the
      # profile NAME). CFBundleVersion (pubspec +N) must strictly increase per
      # upload — bump pubspec before each dispatch.
      - name: Export App Store .ipa
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa
          ls -la build/ios/ipa

      # Resolve the exact .ipa path — Xcode names it after CFBundleDisplayName
      # ("Admin" here), and the upload action stat's app-path LITERALLY (it does
      # NOT expand globs), so a "*.ipa" would ENOENT.
      - name: Resolve .ipa path
        id: ipa
        run: |
          set -euo pipefail
          IPA=$(ls build/ios/ipa/*.ipa | head -n1)
          if [ -z "$IPA" ]; then echo "::error::No .ipa produced by -exportArchive" >&2; exit 1; fi
          echo "path=$IPA" >> "$GITHUB_OUTPUT"

      # Upload to TestFlight (does NOT submit for App Store review — testers get
      # it on the testing channel). api-private-key is the RAW .p8 text (NOT
      # base64). ITSAppUsesNonExemptEncryption=false is already in Info.plist, so
      # the export-compliance TestFlight gate is pre-cleared.
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-type: ios
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      # Best practice even on an ephemeral runner: wipe the decoded profile so it
      # can't survive into a cache or an uploaded artifact. The temp keychain dies
      # with the runner; the .ipa under build/ is gitignored and not uploaded.
      - name: Remove signing material
        if: always()
        run: rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/appstore.mobileprovision"
