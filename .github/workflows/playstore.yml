name: Deploy to Google Play

# Manual only — building + uploading an Android App Bundle is a deliberate
# release action, not a per-push gate. Releases to the Open testing track
# (`beta`) by default, so the beta testers get it with nothing left to do in
# the Console, and Play's "What's new" is set from the version's short release
# notes, the F-Droid changelog digest (docs/release-notes.md step 5). The
# service account holds only "Release apps to testing tracks", so this
# workflow is structurally incapable of touching production; promote to
# production by hand in the Console. `rollout` below 100 makes a staged
# rollout, finished there too.
on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track to release to
        type: choice
        options: [beta, alpha, internal]
        default: beta
      rollout:
        description: Percent of users to roll out to (100 = everyone; less = a staged rollout)
        type: string
        default: '100'
  # Also called by deploy-all.yml, whose release job has already run the
  # suite once for this commit. `skip_tests` exists only on the call: a manual
  # dispatch cannot skip the test gate.
  workflow_call:
    inputs:
      skip_tests:
        description: Set only by deploy-all.yml, whose release job already ran _test.yaml.
        type: boolean
        default: false
      track:
        description: Play testing track to release to (beta, alpha or internal)
        type: string
        default: beta
      rollout:
        description: Percent of users to roll out to (100 = everyone)
        type: string
        default: '100'

# Least privilege: this job only checks out code, builds, and uploads to an
# external store. It never writes back to the repo.
permissions:
  contents: read

jobs:
  # Test gate — mirrors appstore-ios.yml. CI is workflow_dispatch-only, so this
  # is what guarantees the suite ran before a bundle reaches the Play track.
  test:
    # Skipped only under deploy-all.yml (skip_tests), whose release ran it once.
    if: ${{ !inputs.skip_tests }}
    uses: ./.github/workflows/_test.yaml

  deploy-play:
    needs: test
    # A skipped `needs` skips this job too unless it states its own condition;
    # `skipped` is deploy-all.yml's skip_tests, never a failed suite.
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    name: Build and Publish App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Checked before the build, so a bad input or missing notes costs seconds.
      # Play shows at most 500 characters of "What's new" per language; the
      # F-Droid digest is the short version and has the same limit. All three
      # per-ABI copies are identical (tools/check_release_ready.sh).
      - name: Release plan and What's new
        id: plan
        env:
          TRACK: ${{ inputs.track || 'beta' }}
          ROLLOUT: ${{ inputs.rollout || '100' }}
        run: |
          set -euo pipefail
          case "$TRACK" in
            beta|alpha|internal) ;;
            *) echo "::error::'$TRACK' is not a testing track (beta, alpha or internal)."; exit 1 ;;
          esac
          if ! [[ "$ROLLOUT" =~ ^[0-9]+$ ]] || [ "$ROLLOUT" -lt 1 ] || [ "$ROLLOUT" -gt 100 ]; then
            echo "::error::rollout must be a whole percent from 1 to 100, not '$ROLLOUT'."
            exit 1
          fi
          raw="$(grep -m1 '^version:' pubspec.yaml)"
          build="${raw##*+}"; build="${build//[^0-9]/}"
          notes="fastlane/metadata/android/en-US/changelogs/$((build * 10 + 1)).txt"
          if [ ! -s "$notes" ]; then
            echo "::error::$notes is missing or empty: write the release's short notes first (docs/release-notes.md step 5)."
            exit 1
          fi
          chars="$(wc -m < "$notes")"
          if [ "$chars" -gt 500 ]; then
            echo "::error::$notes is $chars characters; Play's What's new takes at most 500."
            exit 1
          fi
          mkdir -p distribution/whatsnew
          cp "$notes" distribution/whatsnew/whatsnew-en-US
          cat distribution/whatsnew/whatsnew-en-US
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          echo "rollout=$ROLLOUT" >> "$GITHUB_OUTPUT"
          echo "fraction=$(awk -v p="$ROLLOUT" 'BEGIN { printf "%.2f", p / 100 }')" >> "$GITHUB_OUTPUT"

      # JDK 17 pinned explicitly. AGP 8.11.1 + Gradle require JDK 17, and
      # android/app/build.gradle.kts compiles against JavaVersion.VERSION_17.
      # The CI `build-android` compile gate leans on the runner's default JDK,
      # but a publish workflow shouldn't let a runner-image bump silently change
      # the bytecode target out from under a shipped release build.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to match ci.yaml / snapcraft.yml (no .flutter-version file).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Reconstruct the release signing material from secrets. Both files are
      # gitignored (android/.gitignore) and never tracked, so CI has zero
      # signing material until this step. Without android/key.properties the
      # release build silently falls back to DEBUG signing, which Play rejects.
      # Paths are exact:
      #   * key.properties -> android/key.properties (rootProject.file = android/)
      #   * key.jks        -> android/app/key.jks    (storeFile rel. to :app)
      - name: Inject Android signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty — cannot produce a Play-signed bundle." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          {
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "storeFile=key.jks"
          } > android/key.properties

      - name: Build Android App Bundle (release)
        # IN_SENTRY_DSN is baked in at compile time (String.fromEnvironment),
        # same pattern as snapcraft.yml / tools/build_release.sh. Empty/unset
        # secret is a safe no-op (Env.sentryDsn defaults to '' -> Sentry stays
        # disabled). Output: build/app/outputs/bundle/release/app-release.aab,
        # signed with the release keystore injected above. versionCode comes
        # from pubspec (5.1.3+6 -> 6); Play requires it to strictly increase, so
        # bump the `+N` in pubspec.yaml before each release dispatch.
        # IN_GOOGLE_SERVER_CLIENT_ID works the same way: unset hides "Sign in
        # with Google" (docs/setup.md § Google Sign-In client IDs).
        run: >-
          flutter build appbundle --release
          --dart-define=IN_SENTRY_DSN=${{ secrets.IN_SENTRY_DSN }}
          --dart-define=IN_GOOGLE_SERVER_CLIENT_ID=${{ secrets.IN_GOOGLE_SERVER_CLIENT_ID }}

      # Upload to the Play Console via the de-facto community action
      # (r0adkll/upload-google-play, @v1 = latest v1.1.x, Play Developer API v3).
      # Credentials: a Google Cloud service-account JSON with the Play Developer
      # API enabled and "Release apps to testing tracks" granted in the Play
      # Console, stored verbatim in the PLAY_SERVICE_ACCOUNT_JSON secret.
      #   status: completed   — released to everyone on the track once Google's
      #                         review passes (Open testing is reviewed);
      #   status: inProgress  — a staged rollout to `userFraction` of them.
      # Two steps rather than one with computed inputs: the action rejects a
      # userFraction on a completed release.
      # If a run ever fails with "Changes cannot be sent for review
      # automatically. Please set the query parameter changesNotSentForReview to
      # true.", add `changesNotSentForReview: true` below (see docs/setup.md).
      - name: Publish to Google Play (${{ steps.plan.outputs.track }})
        if: steps.plan.outputs.rollout == '100'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.invoiceninja.admin
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ steps.plan.outputs.track }}
          status: completed
          whatsNewDirectory: distribution/whatsnew

      - name: Publish to Google Play (${{ steps.plan.outputs.track }}, ${{ steps.plan.outputs.rollout }}% rollout)
        if: steps.plan.outputs.rollout != '100'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.invoiceninja.admin
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ steps.plan.outputs.track }}
          status: inProgress
          userFraction: ${{ steps.plan.outputs.fraction }}
          whatsNewDirectory: distribution/whatsnew

      # Best practice even on an ephemeral runner: wipe the decoded signing
      # material so it can't survive into a later step, a cache, or an uploaded
      # artifact. `if: always()` runs it even when the build or publish fails.
      - name: Remove signing material
        if: always()
        run: rm -f android/app/key.jks android/key.properties
