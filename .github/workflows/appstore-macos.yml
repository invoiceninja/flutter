name: Deploy to TestFlight (macOS)

# Manual only — building + uploading a signed Mac App Store .pkg is a deliberate
# release action. Mirrors playstore.yml / appstore-ios.yml. Uploads to TestFlight
# (testing channel; NOT submitted for App Store review). `flutter build macos`
# only emits a .app — there is NO `flutter build` equivalent to `flutter build
# ipa` for the Mac App Store — so we drive xcodebuild directly: --config-only
# (writes the IN_SENTRY_DSN dart-define into the generated xcconfig) ->
# xcodebuild archive (signed) -> -exportArchive method=app-store (emits a signed
# .pkg) -> altool upload. This is the same --config-only + explicit-xcodebuild
# seam the unsigned `apple` gate in ci.yaml uses, inverted to real signing.
on:
  workflow_dispatch:
  # Also called by deploy-all.yml, whose release job has already run the
  # suite once for this commit. `skip_tests` exists only on the call: a manual
  # dispatch cannot skip the test gate.
  workflow_call:
    inputs:
      skip_tests:
        description: Set only by deploy-all.yml, whose release job already ran _test.yaml.
        type: boolean
        default: false

# Least privilege: this job only checks out code, builds, and uploads to an
# external store. It never writes back to the repo.
permissions:
  contents: read

jobs:
  # Test gate — mirrors appstore-ios.yml. CI is workflow_dispatch-only, so this
  # is what guarantees the suite ran before a build reaches TestFlight.
  test:
    # Skipped only under deploy-all.yml (skip_tests), whose release ran it once.
    if: ${{ !inputs.skip_tests }}
    uses: ./.github/workflows/_test.yaml

  deploy-macos:
    needs: test
    # A skipped `needs` skips this job too unless it states its own condition;
    # `skipped` is deploy-all.yml's skip_tests, never a failed suite.
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    name: Build and Upload macOS to TestFlight
    runs-on: macos-26
    # 80 for the build and upload, plus the TestFlight step's waits.
    timeout-minutes: 130
    # Job-level, not just on the --config-only step: `xcodebuild archive` runs
    # the Runner scheme's pre-action (tools/xcode_inject_sentry_dsn.sh), which
    # re-resolves both values from the environment (then dev.json, absent here)
    # and patches them into the generated xcconfig the compile reads. With the
    # DSN unset the pre-action used to DROP the entry --config-only had
    # written, so every CI archive shipped with Sentry off. The Mac signs in to
    # Google with the iOS client (same bundle id); unset hides the button.
    env:
      IN_SENTRY_DSN: ${{ secrets.IN_SENTRY_DSN }}
      IN_GOOGLE_IOS_CLIENT_ID: ${{ secrets.IN_GOOGLE_IOS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v5

      # Pinned to match ci.yaml / appstore-ios.yml.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # A Mac App Store package needs TWO identities: "Apple Distribution" signs
      # the .app and "Mac Installer Distribution" ("3rd Party Mac Developer
      # Installer") signs the .pkg wrapper. Ours share ONE private key (both
      # certificates were issued from one CSR), so they can't travel in one
      # .p12: both bags carry the same localKeyID and `security import` keeps
      # only one certificate for it — the installer one, which is how the
      # 5.1.24 archive found no "Apple Distribution" identity at all.
      # So: the iOS job's Apple Distribution .p12 (that certificate + the
      # shared key) through the action, then the installer CERTIFICATE alone,
      # which pairs with the key already in the keychain. A .cer import makes
      # no second keychain and needs no second set-key-partition-list, so
      # apple-actions/import-codesign-certs#14 doesn't arise.
      - name: Import the Apple Distribution certificate and key
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}

      - name: Import the Mac Installer Distribution certificate
        env:
          INSTALLER_CERT_BASE64: ${{ secrets.MAC_INSTALLER_CERT_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${INSTALLER_CERT_BASE64:-}" ]; then
            echo "::error::MAC_INSTALLER_CERT_BASE64 is empty — the .pkg cannot be signed (docs/store-deployment-setup.md §3E)." >&2
            exit 1
          fi
          echo "$INSTALLER_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/mac_installer.cer"
          security import "$RUNNER_TEMP/mac_installer.cer" -k signing_temp.keychain \
            -T /usr/bin/pkgbuild -T /usr/bin/productbuild -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/mac_installer.cer"
          # Fail here, by name, rather than as thirty identical Xcode errors.
          identities=$(security find-identity -v signing_temp.keychain)
          for name in "Apple Distribution" "3rd Party Mac Developer Installer"; do
            if ! grep -qF "\"$name: " <<< "$identities"; then
              echo "::error::No valid \"$name\" identity in the signing keychain." >&2
              exit 1
            fi
          done
          echo "Both Mac App Store identities are in the signing keychain."

      # The Mac App Store provisioning profile for com.invoiceninja.admin
      # (DISTINCT from the iOS App Store profile). Modern Xcode reads macOS
      # profiles from ~/Library/MobileDevice/Provisioning Profiles/, keyed by the
      # embedded UUID — install it under that UUID so xcodebuild resolves
      # PROVISIONING_PROFILE_SPECIFIER by name at archive time. Its App ID must
      # have App Sandbox + Sign in with Apple + Keychain Sharing + App Groups
      # enabled (matching Release.entitlements), or the archive fails on an
      # entitlement mismatch. The home-screen widgets' profile
      # (com.invoiceninja.admin.HomeWidgets, docs/home-screen-widgets.md) needs
      # App Sandbox + App Groups.
      - name: Install Mac App Store provisioning profiles
        env:
          PROFILE_BASE64: ${{ secrets.MACOS_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
          HOME_WIDGETS_PROFILE_BASE64: ${{ secrets.MACOS_HOME_WIDGETS_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${PROFILE_BASE64:-}" ]; then
            echo "::error::MACOS_APPSTORE_PROVISIONING_PROFILE_BASE64 is empty — cannot sign for the Mac App Store." >&2
            exit 1
          fi
          if [ -z "${HOME_WIDGETS_PROFILE_BASE64:-}" ]; then
            echo "::error::MACOS_HOME_WIDGETS_APPSTORE_PROVISIONING_PROFILE_BASE64 is empty — the embedded home-screen widgets cannot be signed (docs/store-deployment-setup.md)." >&2
            exit 1
          fi
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          # `security cms -D` decodes the signed profile plist; key each
          # installed file by its own UUID (the name Xcode looks it up under).
          for b64 in "$PROFILE_BASE64" "$HOME_WIDGETS_PROFILE_BASE64"; do
            echo "$b64" | base64 --decode > /tmp/macos_appstore.provisionprofile
            UUID=$(security cms -D -i /tmp/macos_appstore.provisionprofile | plutil -extract UUID raw -)
            cp /tmp/macos_appstore.provisionprofile "$PROFILE_DIR/$UUID.provisionprofile"
            rm -f /tmp/macos_appstore.provisionprofile
          done

      # The ASC API key (.p8) for the altool upload. altool searches
      # ~/.appstoreconnect/private_keys/ for AuthKey_<KEY_ID>.p8.
      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      # --config-only writes the build settings (incl. the IN_SENTRY_DSN and
      # IN_GOOGLE_IOS_CLIENT_ID dart-defines, base64'd into
      # macos/Flutter/ephemeral/Flutter-Generated.xcconfig as DART_DEFINES=)
      # that the xcodebuild Flutter phase reads — so both are baked into the AOT
      # binary even though the compile happens under xcodebuild below. An empty
      # or unset secret is a safe no-op (Sentry off / Google button hidden).
      - name: Configure macOS release build
        run: >-
          flutter build macos --release --config-only
          --dart-define=IN_SENTRY_DSN="$IN_SENTRY_DSN"
          --dart-define=IN_GOOGLE_IOS_CLIENT_ID="$IN_GOOGLE_IOS_CLIENT_ID"

      # Guard: a build that shows "Sign in with Google" (the secret is set) but
      # has no reversed-client-ID URL scheme crashes on the first tap. The
      # scheme is committed in macos/Runner/Info.plist, so this trips only when
      # the secret names a different client than the one committed there
      # (docs/setup.md § Google Sign-In client IDs).
      - name: Check the Google Sign-In URL scheme
        run: |
          set -euo pipefail
          if [ -z "${IN_GOOGLE_IOS_CLIENT_ID:-}" ]; then
            echo "IN_GOOGLE_IOS_CLIENT_ID is not set — Sign in with Google stays hidden."
            exit 0
          fi
          suffix=".apps.googleusercontent.com"
          prefix="${IN_GOOGLE_IOS_CLIENT_ID%"$suffix"}"
          if [ "$prefix" = "$IN_GOOGLE_IOS_CLIENT_ID" ] || [ -z "$prefix" ]; then
            echo "::error::IN_GOOGLE_IOS_CLIENT_ID must be an iOS OAuth client ID ending in $suffix." >&2
            exit 1
          fi
          scheme="com.googleusercontent.apps.$prefix"
          if ! plutil -extract CFBundleURLTypes json -o - macos/Runner/Info.plist | grep -qF "\"$scheme\""; then
            echo "::error::IN_GOOGLE_IOS_CLIENT_ID is set but macos/Runner/Info.plist has no $scheme URL scheme — Sign in with Google would crash." >&2
            exit 1
          fi
          echo "The Google Sign-In URL scheme is registered."

      # Real distribution signing — the INVERSE of the unsigned CI gate (which
      # forces CODE_SIGN_IDENTITY="-" / CODE_SIGNING_ALLOWED=NO). The tracked
      # pbxproj still says Automatic + "Apple Development"; we OVERRIDE on the
      # command line so the committed project is untouched (same override
      # mechanism the unsigned gate uses, opposite values). No
      # -allowProvisioningUpdates flag: its ABSENCE means xcodebuild never phones
      # home and must use exactly the injected profile (there is no `=NO` form).
      # Per target, not on the command line: a PROVISIONING_PROFILE_SPECIFIER
      # there applies to every target, and the embedded widget extension has
      # its own bundle id and profile (tools/ci_macos_target_profiles.rb).
      - name: Archive macOS app (signed for distribution)
        run: |
          set -euo pipefail
          # The xcodeproj gem ships with CocoaPods, which the runner has —
          # installed here only if that ever changes (as appstore-ios.yml).
          ruby -e 'require "xcodeproj"' 2>/dev/null || gem install xcodeproj --no-document
          ruby tools/ci_macos_target_profiles.rb
          xcodebuild archive \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/macos-release/Runner.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=NPC44Y2C98

      # Prove the DSN and the Google client ID reached the shipped binary — see
      # the same step in appstore-ios.yml. The xcconfig decode is a quick pointed
      # diagnosis; the binary grep is the authoritative check. A key whose
      # secret is unset is skipped.
      - name: Verify the dart-defines in the archived binary
        run: |
          set -euo pipefail
          archive=build/macos-release/Runner.xcarchive
          app_bin=$(find "$archive/Products/Applications" -path '*/App.framework/App' \( -type f -o -type l \) | head -n1)
          if [ -z "$app_bin" ]; then
            echo "::error::No App.framework/App in $archive." >&2
            exit 1
          fi
          defines=$(grep -E '^DART_DEFINES=' macos/Flutter/ephemeral/Flutter-Generated.xcconfig | head -n1 | sed 's/^DART_DEFINES=//' || true)
          decoded=""
          IFS=',' read -ra entries <<< "$defines"
          for e in ${entries[@]+"${entries[@]}"}; do
            decoded="$decoded$(printf '%s' "$e" | /usr/bin/base64 -D 2>/dev/null || true)"$'\n'
          done
          for key in IN_SENTRY_DSN IN_GOOGLE_IOS_CLIENT_ID; do
            value="${!key:-}"
            if [ -z "$value" ]; then
              echo "$key is not set — nothing to verify."
              continue
            fi
            if ! printf '%s' "$decoded" | grep -qxF -- "$key=$value"; then
              echo "::warning::$key is missing from DART_DEFINES in macos/Flutter/ephemeral/Flutter-Generated.xcconfig."
            fi
            if ! grep -qaF -- "$value" "$app_bin"; then
              echo "::error::$key is set but not in the archived $app_bin — the build would ship without it." >&2
              exit 1
            fi
            echo "$key is in the archived binary."
          done

      # method=app-store on a macOS archive emits a signed Mac App Store .pkg
      # (installer-signed) via the committed macos/ExportOptions.plist, which
      # names both certs (signingCertificate + installerSigningCertificate).
      # Each name is matched against the start of the certificate's common
      # name, so the installer one is "3rd Party Mac Developer Installer" (our
      # certificate's CN, the legacy name for that type): "Mac Installer
      # Distribution" matched nothing and failed 5.1.24's export with "No
      # certificate ... matching 'Mac Installer Distribution' found".
      - name: Export Mac App Store package
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath build/macos-release/Runner.xcarchive \
            -exportOptionsPlist macos/ExportOptions.plist \
            -exportPath build/macos-release/export
          ls -la build/macos-release/export

      # First-party, version-stable macOS upload path. --type macos for a MAS
      # .pkg; --apiKey/--apiIssuer authenticate via the .p8 installed above. This
      # lands the build for TestFlight testers only — it does NOT submit for App
      # Store review. CFBundleVersion (pubspec +N) must exceed the highest build
      # already on the record — bump pubspec before dispatch (see docs/setup.md).
      - name: Upload to App Store Connect (TestFlight)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          PKG=$(ls build/macos-release/export/*.pkg | head -n1)
          if [ -z "$PKG" ]; then echo "::error::No .pkg produced by xcodebuild -exportArchive" >&2; exit 1; fi
          echo "Uploading $PKG"
          xcrun altool --upload-app \
            -f "$PKG" \
            --type macos \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      # Hand the build to testers, as used to be done by hand in App Store
      # Connect (tools/testflight_release.py): set its "What to Test" to the
      # release's short digest, the list Google Play gets as "What's new"
      # (changelogs/<build × 10 + 1>.txt) minus any line naming another
      # platform; wait for Apple to process it; add it to the external group
      # (the public TestFlight link); submit it for beta review. External
      # testers are notified once Apple approves. continue-on-error: the build
      # is already up, so a failure here means "finish it by hand in App Store
      # Connect", not a failed release.
      - name: Release to TestFlight testers
        continue-on-error: true
        timeout-minutes: 50
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: python3 tools/testflight_release.py --platform MAC_OS --timeout 2700

      # Wipe every piece of decoded signing material so it can't survive into a
      # later step, cache, or uploaded artifact. `if: always()` runs on failure too.
      - name: Remove signing material
        if: always()
        # Pass the Key ID via env (like the install/upload steps) rather than
        # interpolating the secret into the command line.
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"
          # No `security delete-keychain` here: import-codesign-certs's own post
          # step deletes signing_temp, and fails the job (exit 50) when this
          # step got there first — the 5.1.24 run uploaded and still went red.
