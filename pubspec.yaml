name: admin
description: 'Client for Invoice Ninja'
publish_to: 'none'
version: 5.1.19+22

environment:
  sdk: ^3.11.5

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_foreground: "assets/images/icon.png"
  adaptive_icon_background: "#000000"

# Dependency versions (verified 2026-10-23, Flutter 3.47.7): everything is at
# the newest version the graph allows except a few holds — go_router 18 and
# google_fonts 9 (they move onto `material_ui`, which go_router 18 then fails to
# recognise as our MaterialApp: no page transitions), sentry_flutter 10 in
# packages/store_services (Android minSdk 26), and connectivity_plus 7.3.2
# (dbus conflict with desktop_drop 0.8.4). `test` caps analyzer <14, which
# holds freezed at 4.0.1. Reasons, caps and the routine-bump recipe:
# docs/setup.md § Dependency updates.
dependencies:
  app_links: ^7.2.2
  collection: ^1.18.0
  connectivity_plus: ^7.3.1
  crop_your_image: ^2.0.1
  crypto: ^3.0.7
  decimal: ^3.2.6
  desktop_drop: ^0.8.4
  drift: ^2.35.2
  file_picker: ^13.1.0
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_contacts: ^2.6.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_widget_from_html_core: ^0.17.4
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  http: ^1.5.0
  # Camera and photo-library picks on a phone's document surfaces (Camera /
  # Photos tiles, Scan Receipt). First-party and androidx-only, so the F-Droid
  # build needs no swap; its one Play Services manifest hint is stripped in
  # AndroidManifest.xml (docs/fdroid.md).
  image_picker: ^1.2.4
  # Direct only to switch on Android's photo picker
  # (`ImagePickerAndroid.useAndroidPhotoPicker`, document_capture.dart).
  image_picker_android: ^0.8.13+25
  image_picker_platform_interface: ^2.11.2
  # integration_test lives here (not dev_dependencies) as a workaround for
  # flutter/flutter#186800 + #169336: on Flutter 3.44–3.47 the dev-dependency
  # plugin is dropped from the release native classpath but still emitted into
  # GeneratedPluginRegistrant.java, breaking release builds on every native
  # platform (Android/iOS/macOS). Move back to dev_dependencies once fixed upstream.
  # Tracked in docs/upstream-workarounds.md.
  integration_test:
    sdk: flutter
  intl: any
  json_annotation: ^4.12.0
  local_auth: ^3.0.2
  logging: ^1.2.0
  overflow_view: ^0.5.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  printing: ^5.15.1
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  # Record links go out through the system share sheet on touch, where
  # "copy, leave the app, paste" is three steps for what the platform
  # does in one (invoiceninja/flutter#144). Desktop still copies.
  share_plus: ^13.3.1
  sign_in_with_apple: ^8.2.0
  sqlite3: ^3.7.1
  # Google Sign-In, store billing and Sentry live behind this local package so
  # the F-Droid build can swap it for its FOSS twin without touching lib/
  # (tools/prepare_foss.sh, docs/fdroid.md). Never add those SDKs here.
  store_services:
    path: packages/store_services
  super_editor: any
  # IANA tzdb, for the callee's real local time on a phone number
  # (docs/tap-to-call.md). The server's `timezones.utc_offset` is STANDARD-time
  # only, so comparing it against the device's DST-aware offset made a New York
  # client look foreign to a New York user for eight months a year, and printed
  # a clock an hour behind. `Timezone.name` is the IANA id and this resolves it.
  # `main.dart` loads the 10-year table, not the full one — see the note there.
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  web: ^1.1.2
  # Hosted real-time updates speak the Pusher protocol over a plain websocket
  # (docs/realtime-updates.md). Pure Dart on every platform, so the F-Droid
  # build needs no swap. Was already in the lockfile transitively.
  web_socket_channel: ^3.0.3
  webview_flutter: ^4.14.1

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  # Used by tools/gen_app_icons.dart to build the multi-size Windows .ico, and
  # by test/lint/app_icons_test.dart to inspect the committed icon rasters.
  # Already resolved transitively (via flutter_launcher_icons); pinned direct so
  # the script's import is explicit. No lock change — stays 4.8.0.
  image: ^4.12.0
  json_serializable: ^6.15.2
  msix: ^3.18.0

dependency_overrides:
  # re_editor's transitive isolate_manager 4.x → isolate_contactor uses
  # `dart:html`, which dart2wasm rejects (blocks `flutter build web --wasm`).
  # isolate_manager 6.x is wasm-clean and on `package:web`.
  isolate_manager: ^6.3.2
  # super_editor's active upstream is Flutter-Bounty-Hunters; the superlistapp
  # fork stalled in Jan 2026 (pre-3.44) and won't compile under Flutter 3.44
  # (its TextInputConnectionDecorator misses TextInputConnection.updateStyle).
  # The FBH `stable` branch carries the full 3.44 IME surface. Pinned to a SHA
  # for reproducibility.
  super_editor:
    git:
      url: https://github.com/Flutter-Bounty-Hunters/super_editor
      path: super_editor
      ref: 8705fe9da3633e20ef7b32b934f3d933fa3bab94

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/images/
    - assets/images/gateway_logos/
    # Script fallbacks (Noto, OFL, variable) for the scripts Inter Tight and
    # JetBrains Mono lack. Plain assets, loaded after the first frame by
    # `ScriptFonts` (lib/app/script_fonts.dart) — declared under `fonts:`, the
    # web engine would download all ~1.7 MB before the first frame for every
    # user. CJK is left to the system / engine fallback (several MB each).
    - assets/fonts/NotoSansArabic.ttf
    - assets/fonts/NotoSansHebrew.ttf
    - assets/fonts/NotoSansThai.ttf
    - assets/fonts/NotoSansLao.ttf
    - assets/fonts/NotoSansKhmer.ttf
  # Bundled app fonts (variable TTFs) so the web app loads them from our own
  # origin instead of fetching from fonts.gstatic.com at runtime. Each is a
  # single variable file; a TextStyle's `fontWeight` drives its `wght` axis.
  # The invoice designer still fetches arbitrary user-chosen fonts on demand
  # via `google_fonts` (GoogleFonts.getFont) — that's intentional.
  fonts:
    - family: Inter Tight
      fonts:
        - asset: assets/fonts/InterTight.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
    # Satisfies the Flutter web engine's hardcoded default-font check
    # (canvaskit + skwasm both look for a family literally named "Roboto") so it
    # never downloads Roboto from fonts.gstatic.com at boot. Aliased to the
    # bundled Inter Tight — no extra bytes; any text that hits the engine
    # fallback renders in the app's own typeface.
    - family: Roboto
      fonts:
        - asset: assets/fonts/InterTight.ttf
    # Material Design Icons (Pictogrammers, Apache-2.0). Vendored TTF instead of
    # the `material_design_icons_flutter` package, which subclasses IconData and
    # so can't compile under Flutter 3.44's `final` IconData. Glyphs are
    # referenced as plain const IconData (lib/app/mdi_icons.dart), so the font
    # also tree-shakes to the used glyph subset in release builds.
    - family: Material Design Icons
      fonts:
        - asset: assets/fonts/MaterialDesignIcons.ttf

# Microsoft Store packaging for the `msix` dev-dependency (dart run msix:create).
# identity_name / publisher / publisher_display_name MUST match Partner Center →
# Product management → Product identity exactly, or upload validation rejects the
# package. Without this section the package derives `com.flutter.admin` from the
# pubspec `name:` and the Store rejects the PublisherDisplayName mismatch.
# `store: true` emits an unsigned package (the Store re-signs on ingestion — no
# self-signed certificate). `msix_version` is auto-derived from `version:` above;
# bump `version:` for each new submission.
# `logo_path` is REQUIRED for branding: without it msix copies its bundled
# FLUTTER-logo assets into the AppxManifest visual tree (Start tile, taskbar,
# Search) — app_icon.ico only covers the exe/window icon. That shipped once and
# is what invoiceninja/flutter#25 reported, so test/lint/app_icons_test.dart now
# fails the build if this key goes missing. The PNG is the baked 1024² raster
# emitted by `dart run tools/gen_app_icons.dart` (the macOS source is an alpha
# matte, unusable raw); `trim_logo: false` keeps msix from re-cropping art whose
# framing is already deliberate.
# `protocol_activation` registers the invoiceninja:// scheme for the calendar
# OAuth callback (paired with the app_links second-instance forward in
# windows/runner/main.cpp).
msix_config:
  display_name: Invoice Ninja - Beta
  publisher_display_name: Invoice Ninja
  identity_name: InvoiceNinja.AdminPortal
  publisher: CN=2B7AA393-06A0-46F5-AF85-1917142440C3
  store: true
  languages: en-us
  logo_path: windows/runner/resources/store_logo.png
  trim_logo: false
  protocol_activation: invoiceninja
