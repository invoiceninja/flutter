name: Deploy to Web

# Builds the web app once and ships it two ways (docs/web-deploy.md):
#
#   hosted       the `pages/` tree, published to Cloudflare Pages (Direct
#                Upload) and served at admin.invoicing.co. Its boot page names
#                https://invoicing.co as the API (`data-api-url`).
#   self-hosted  the `server/` tree, attached to this repo's GitHub Release as
#                invoiceninja-web-<version>.tar.gz: public/flutter/ and
#                resources/views/flutter/index.blade.php (the app), plus
#                resources/views/landing/apps.blade.php and public/landing/
#                (the invoicing.co landing page). The backend's release
#                workflow unpacks it into the server tarball; nothing is ever
#                committed to invoiceninja/invoiceninja.
#
# Modes: `test` builds both trees and runs every gate, publishing nothing.
# `preview` also deploys `pages/` to the Pages preview branch. `production`
# (Deploy to all only, on the release's tagged commit) deploys to the preview
# branch, checks what Pages serves there, then promotes to the production
# branch, and uploads the tarball. Until the Pages project exists (repo
# variable CLOUDFLARE_PAGES_PROJECT, secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID), the Pages deploy is skipped with a notice.
#
# Three jobs, so neither shipment can hold up the other: `deploy-web` builds
# and checks the self-hosted side and hands both trees on as artifacts;
# `pages` checks and publishes the hosted tree; `attach` uploads the tarball
# (production only, and the only job with write access).
#
# Shaped like the store workflows (test/lint/deploy_all_workflow_test.dart):
# skip_tests on workflow_call only, a `test` job, and one job that needs it.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: test builds and checks only; preview also deploys to the Pages preview branch.
        type: choice
        options: [test, preview]
        default: test
  workflow_call:
    inputs:
      skip_tests:
        description: Set only by deploy-all.yml, whose release job already ran _test.yaml.
        type: boolean
        default: false
      mode:
        description: test, preview or production (production uploads the release tarball).
        type: string
        default: test

permissions:
  contents: read

# Never `deploy-all` (the caller's group): a caller and a callee in one group
# deadlock. A second dispatch waits for the first instead of cancelling it.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  test:
    # Skipped only under deploy-all.yml (skip_tests), whose release ran it once.
    if: ${{ !inputs.skip_tests }}
    uses: ./.github/workflows/_test.yaml

  deploy-web:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    name: Build, check and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.prep.outputs.version }}
      tarball: ${{ steps.tarball.outputs.name }}
    env:
      MODE: ${{ inputs.mode || 'test' }}
      API_URL: https://invoicing.co
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      # Default credentials (see the store workflows): the repo's stray
      # .dart_skills gitlinks fail checkout's submodule walk otherwise.
      - uses: actions/checkout@v5

      - name: Check the mode
        run: |
          case "$MODE" in
            test|preview|production) ;;
            *) echo "::error::Unknown mode '$MODE' (test, preview or production)."; exit 1 ;;
          esac

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # One FOSS build serves hosted and self-hosted: nothing in store_services
      # runs on web, and self-hosted stays free of store SDKs as admin-portal's
      # main.foss.dart.js was. --web skips the native-only steps.
      - name: Use the FOSS dependency graph
        run: tools/prepare_foss.sh --web

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # --pwa-strategy=none: no service worker at all (the boot page clears the
      # old app's). --no-web-resources-cdn: the engine is served from our folder.
      - name: Build web
        run: flutter build web --wasm --release --no-web-resources-cdn --pwa-strategy=none

      - name: Cache-bust, build.json, version
        id: prep
        run: |
          set -euo pipefail
          tools/stamp_web_cache_bust.sh build/web >/dev/null
          # As appimage.yml makes the tag: 5.1.4+7 -> 5.1.4, quotes, spaces and
          # a trailing CR dropped.
          raw="$(grep -m1 '^version:' pubspec.yaml)"
          full="${raw#*version:}"; full="${full//[\"\' ]/}"; full="${full%$'\r'}"
          version="${full%%+*}"
          jq -n --arg version "$full" --arg sha "$GITHUB_SHA" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, sha: $sha, run_url: $run_url, built_at: $built_at}' \
            > build/web/build.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bootstrap_hash=$(sha256sum build/web/flutter_bootstrap.js | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # The tarball names the release, so production only ships the commit the
      # release tagged (appimage.yml creates v<version> from pubspec).
      - name: Production ships the tagged commit only
        if: env.MODE == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.prep.outputs.version }}"
          tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null || true)"
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::$tag is ${tagged:-missing}, not this commit ($GITHUB_SHA). Production runs only from Deploy to all after the release."
            exit 1
          fi

      - name: Assemble the two trees
        run: |
          set -euo pipefail
          v="${{ steps.prep.outputs.bootstrap_hash }}"
          excludes=(--exclude /index.html --exclude /flutter_service_worker.js
                    --exclude /drift_worker.dart --exclude /.last_build_id --exclude '*.symbols')

          # Self-hosted: the build under public/flutter/ with the server's boot
          # page as a Blade view. The installed PWA's start_url and scope are
          # the site root, one level up from the folder.
          mkdir -p server/public/flutter server/resources/views/flutter server/resources/views/landing
          rsync -a "${excludes[@]}" build/web/ server/public/flutter/
          jq '.start_url = "../" | .scope = "../"' build/web/manifest.json > server/public/flutter/manifest.json
          python3 tools/web_deploy/render_boot_page.py --blade --version "$v" \
            -o server/resources/views/flutter/index.blade.php
          # The invoicing.co landing page, built from landing/apps.json.
          python3 tools/web_deploy/render_landing.py --blade --assets-base /landing/ \
            --assets-dir server/public/landing -o server/resources/views/landing/apps.blade.php

          # Hosted: the build at the root of the Pages site, its static boot page
          # naming the API, a 404 page (Pages would otherwise answer a missing
          # file with index.html and a 200) and _headers.
          mkdir -p pages
          rsync -a "${excludes[@]}" build/web/ pages/
          jq '.start_url = "./" | .scope = "./"' build/web/manifest.json > pages/manifest.json
          python3 tools/web_deploy/render_boot_page.py --static --hosted --base-href / \
            --api-url "$API_URL" --version "$v" -o pages/index.html
          cp tools/web_deploy/pages/404.html tools/web_deploy/pages/_headers pages/

          # Local roots for the gates: site/ is the self-hosted page as a server
          # renders it, standalone.html the same page without data-served (so a
          # local copy keeps the server field), and smoke-js/ the same tree with
          # the bootstrap forced to dart2js (canvaskit), which rules out skwasm.
          mkdir -p site smoke-js
          cp -a server/public/flutter site/flutter
          python3 tools/web_deploy/render_boot_page.py --static --version "$v" -o site/index.html
          python3 tools/web_deploy/render_boot_page.py --static --standalone --version "$v" -o site/standalone.html
          cp tools/web_deploy/serve.py site/serve.py
          cp -al site/flutter smoke-js/flutter
          cp site/index.html smoke-js/index.html
          rm smoke-js/flutter/flutter_bootstrap.js
          sed 's/_flutter\.loader\.load();/_flutter.loader.load({config:{renderer:"canvaskit"}});/' \
            site/flutter/flutter_bootstrap.js > smoke-js/flutter/flutter_bootstrap.js
          grep -q 'renderer:"canvaskit"' smoke-js/flutter/flutter_bootstrap.js

      - name: Served-files gate (self-hosted)
        run: |
          set -euo pipefail
          python3 tools/web_deploy/serve.py site 8000 &
          server=$!
          trap 'kill $server' EXIT
          sleep 1
          python3 tools/web_deploy/check_served_files.py site http://127.0.0.1:8000 | tee files-gate.txt

      # A hard gate. If headless WebGL proves flaky on the runner, add
      # `continue-on-error: true` here and the summary says so.
      - name: Boot smoke (self-hosted, WASM and dart2js)
        run: |
          set -euo pipefail
          python3 tools/web_deploy/serve.py site 8001 &
          wasm_server=$!
          python3 tools/web_deploy/serve.py smoke-js 8002 &
          js_server=$!
          trap 'kill $wasm_server $js_server' EXIT
          sleep 1
          tools/web_deploy/smoke_webdriver.sh http://127.0.0.1:8001/ 120 | tee smoke-wasm.txt
          CHROMEDRIVER_PORT=9516 tools/web_deploy/smoke_webdriver.sh http://127.0.0.1:8002/ 120 | tee smoke-js.txt

      - name: Package the self-hosted tarball
        id: tarball
        run: |
          set -euo pipefail
          name="invoiceninja-web-${{ steps.prep.outputs.version }}.tar.gz"
          tar -czf "$name" -C server public resources
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$name" | cut -f1)" >> "$GITHUB_OUTPUT"

      # Handed to the `pages` and `attach` jobs, and kept for a look.
      - name: Upload the hosted tree
        uses: actions/upload-artifact@v4
        with:
          name: web-pages
          path: pages/
          retention-days: 7

      - name: Upload the self-hosted tarball
        uses: actions/upload-artifact@v4
        with:
          name: web-tarball
          path: ${{ steps.tarball.outputs.name }}
          retention-days: 7

      - name: Upload the self-hosted site
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-staged
          path: site/
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          gz() { [ -f "$1" ] && gzip -9c "$1" | wc -c | awk '{printf "%.1f MB", $1/1048576}' || echo "n/a"; }
          {
            echo "## Deploy to Web: $MODE (build and self-hosted)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| App | ${{ steps.prep.outputs.version }} at \`${GITHUB_SHA:0:8}\` |"
            echo "| Self-hosted tarball | ${{ steps.tarball.outputs.name }} (${{ steps.tarball.outputs.size }}) |"
            echo "| Download (gzip) | main.dart.wasm $(gz build/web/main.dart.wasm), main.dart.js $(gz build/web/main.dart.js) |"
            echo "| Served-files gate | $(tail -1 files-gate.txt 2>/dev/null || echo 'did not run') |"
            echo "| Boot smoke | WASM: $(head -1 smoke-wasm.txt 2>/dev/null || echo 'did not run'); dart2js: $(head -1 smoke-js.txt 2>/dev/null || echo 'did not run') |"
            echo
            echo "Try it locally (standalone.html has the usual server field, so it can sign in to the demo server):"
            echo
            echo '```'
            echo "gh run download $GITHUB_RUN_ID -R $GITHUB_REPOSITORY -n web-staged -D web-staged"
            echo "cd web-staged/site && python3 serve.py ."
            echo '# open http://127.0.0.1:8000/standalone.html'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The hosted app: checked locally, then deployed and checked again where
  # Pages serves it. In production the check runs on a preview deployment,
  # before production is touched.
  pages:
    needs: [test, deploy-web]
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') && needs.deploy-web.result == 'success' }}
    name: Hosted (Cloudflare Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ inputs.mode || 'test' }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: web-pages
          path: pages

      # Pages refuses any file over 25 MiB; main.dart.js was 23.6 MiB on 5.1.24.
      - name: Size gate (25 MiB a file)
        id: size
        run: |
          set -euo pipefail
          largest="$(find pages -type f -printf '%s %p\n' | sort -nr | head -1)"
          echo "largest=$(awk '{printf "%.1f MiB %s", $1/1048576, $2}' <<<"$largest")" >> "$GITHUB_OUTPUT"
          over="$(find pages -type f -size +25M)"
          if [ -n "$over" ]; then
            echo "::error::Over Cloudflare Pages' 25 MiB per-file limit:"; echo "$over"; exit 1
          fi

      - name: Served-files gate and boot smoke (local)
        run: |
          set -euo pipefail
          python3 tools/web_deploy/serve.py pages 8003 &
          server=$!
          trap 'kill $server' EXIT
          sleep 1
          python3 tools/web_deploy/check_served_files.py pages http://127.0.0.1:8003 --build . | tee files-gate.txt
          tools/web_deploy/smoke_webdriver.sh http://127.0.0.1:8003/ 120 | tee smoke.txt

      - name: Deploy to the preview branch
        id: preview
        if: env.MODE != 'test' && env.PAGES_PROJECT != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy pages --project-name=${{ env.PAGES_PROJECT }} --branch=preview --commit-hash=${{ github.sha }}

      # What Pages actually serves: its types, and that a file that exists is
      # not answered by a fallback.
      - name: Served-files gate on the preview deployment
        if: steps.preview.outcome == 'success'
        run: python3 tools/web_deploy/check_served_files.py pages "${{ steps.preview.outputs.deployment-url }}" --build . | tee files-gate-deployed.txt

      # Every file is already uploaded, so this second deploy only points the
      # production branch at them.
      - name: Promote to production
        id: production
        if: env.MODE == 'production' && steps.preview.outcome == 'success'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy pages --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}

      - name: No Pages project yet
        if: env.MODE != 'test' && env.PAGES_PROJECT == ''
        run: echo "::notice::Pages deploy skipped. Set the CLOUDFLARE_PAGES_PROJECT variable and the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (docs/store-deployment-setup.md)."

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Deploy to Web: $MODE (hosted)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Largest file (25 MiB limit) | ${{ steps.size.outputs.largest }} |"
            echo "| Served-files gate | local: $(tail -1 files-gate.txt 2>/dev/null || echo 'did not run'); preview deployment: $(tail -1 files-gate-deployed.txt 2>/dev/null || echo 'not deployed') |"
            echo "| Boot smoke | $(head -1 smoke.txt 2>/dev/null || echo 'did not run') |"
            echo "| Preview | ${{ steps.preview.outputs.deployment-url || 'not deployed' }} |"
            echo "| Production | ${{ steps.production.outputs.deployment-url || 'not deployed' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The self-hosted tarball onto the release, whatever happens to Pages.
  attach:
    needs: [test, deploy-web]
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') && needs.deploy-web.result == 'success' && inputs.mode == 'production' }}
    name: Attach the tarball to the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The one job with write access; Deploy to all grants it on the web leg.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-tarball

      - name: Upload to v${{ needs.deploy-web.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "v${{ needs.deploy-web.outputs.version }}" "${{ needs.deploy-web.outputs.tarball }}" --clobber
