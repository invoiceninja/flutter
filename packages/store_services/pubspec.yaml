name: store_services
description: >-
  The store builds' non-free SDKs (Google Sign-In, Play Billing / StoreKit,
  Sentry, the native review sheets, Stripe Terminal, and on Android ML Kit text
  recognition and Credential Manager passkeys) behind a narrow API. The F-Droid build swaps this package for its
  FOSS twin in ../store_services_foss — see docs/fdroid.md.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  in_app_purchase: ^3.3.1
  in_app_purchase_storekit: ^0.4.15
  in_app_review: ^2.0.10
  # A fork pinned to BreX900/mek-packages#171 (collect / confirm split, and the
  # Android cancel hang) until a release ships it — docs/upstream-workarounds.md.
  mek_stripe_terminal:
    git:
      url: https://github.com/hillelcoren/mek-packages.git
      ref: 8f8153438cd49e625e4ca141c6e1aa791198c1aa
      path: mek_stripe_terminal
  sentry_flutter: ^9.30.1

# An Android-only plugin, for ML Kit receipt OCR (docs/receipt-ocr.md),
# Credential Manager passkeys (docs/passkeys.md) and Stripe Terminal's device
# check and permissions. Their Dart sides are `ReceiptTextRecognizer` and
# `NativePasskeys` in the app and `StripeTerminal` here, over channels (the
# Stripe channel's iOS half is in Runner); the FOSS twin is no plugin at all.
flutter:
  plugin:
    platforms:
      android:
        package: com.invoiceninja.store_services
        pluginClass: StoreServicesPlugin
