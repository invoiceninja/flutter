MaintainerNotes: |-
  Upstream builds and signs this exact recipe with fdroid build, in the
  fdroidserver:buildserver-trixie image, before publishing the binaries
  (tools/fdroid_build.sh, docs/fdroid.md in the source repo). The server it
  talks to uses the Elastic-2.0 license, which is approved neither by OSI nor
  FSF, see https://invoiceninja.github.io/docs/legal/license/

