<!DOCTYPE html>
<!-- Cloudflare Pages serves this for a path that doesn't exist. Without it,
     Pages answers every missing file with index.html and a 200, which hides a
     broken build from the served-files gate (docs/web-deploy.md). -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Not found · Invoice Ninja</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F6F4EF; color: #1A1814; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) { body { background: #000; color: #F2F2F2; } a { color: #7AB4E8; } }
    main { padding: 24px; text-align: center; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    a { color: #1F56C4; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p><a href="/">Open Invoice Ninja</a></p>
  </main>
</body>
</html>
