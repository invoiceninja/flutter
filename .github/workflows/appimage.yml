name: Deploy to GitHub Releases

# Manual only — building + publishing the Linux AppImage is a deliberate release
# action, not a per-push gate. Unlike the snap (and every other publish pipeline,
# which push to an external store's testing channel), an AppImage has no store:
# it's distributed as a file attached to a GitHub Release. Ships a per-version
# `prerelease` (mirroring the snap's edge / grade: devel + the README "Beta"
# posture); set the `publish` input to false for a build-only dry run.
#
# The same Release carries the F-Droid APKs (one per ABI), which F-Droid
# publishes under our signature only when its own rebuild matches them byte-for-
# byte. So they are built by F-Droid's tooling from tools/foss/
# com.invoiceninja.admin.yml, rebuilt in a varied environment, and checked with
# F-Droid's own verify step before anything is published (docs/fdroid.md § The
# F-Droid APK is built by F-Droid's own tooling).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Create/update the GitHub Release (uncheck for a build-only dry run)
        type: boolean
        default: true

# Read-only by default. `preflight` and `publish` get contents: write — the
# only jobs in any publish workflow that do: publish creates the v<version> tag
# + Release, and preflight needs push access only because GitHub lists draft
# releases to nobody else. No external secret is needed for either (the
# built-in GITHUB_TOKEN suffices); the repo's Actions token policy must allow
# write (Settings -> Actions -> General -> Workflow permissions).
permissions:
  contents: read

# Only tag/release-writing workflow in the repo — serialize dispatches so two
# can't race on the same v<version> tag.
concurrency:
  group: appimage-release
  cancel-in-progress: false

jobs:
  # Decides what this run may publish, before anything is built:
  #  - the tag must not already point at another commit — F-Droid builds the
  #    tag, so APKs from github.sha would never verify;
  #  - APKs already attached are never replaced (F-Droid may have verified those
  #    bytes), so a re-dispatch only replaces the AppImage, as it always has.
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      fdroid_needed: ${{ steps.check.outputs.fdroid_needed }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag, the Release and the recipe
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          # Single source for the asset names AND the git tag: 5.1.4+7 -> 5.1.4.
          raw="$(grep -m1 '^version:' pubspec.yaml)"
          v="${raw#*version:}"; v="${v//[\"\' ]/}"; v="${v%%+*}"; v="${v%$'\r'}"
          tag="v$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

          # A dry run publishes nothing, so it always rehearses the full build.
          if [ "$PUBLISH" != true ]; then
            echo "fdroid_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The commit an annotated tag peels to (^{}), else the lightweight tag's own.
          refs="$(git ls-remote --tags origin)"
          tag_sha="$(awk -v r="refs/tags/$tag^{}" '$2 == r { print $1 }' <<<"$refs")"
          [ -n "$tag_sha" ] || tag_sha="$(awk -v r="refs/tags/$tag" '$2 == r { print $1 }' <<<"$refs")"
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::$tag already points at $tag_sha, not $GITHUB_SHA. F-Droid builds the tag, so APKs from this commit would never verify. Bump the version in pubspec.yaml."
            exit 1
          fi

          drafts="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.draft and .tag_name == \"$tag\")] | length")"
          if [ "$drafts" != 0 ]; then
            echo "::error::A draft Release for $tag is left over from a failed run. Delete it (Releases page) and re-dispatch."
            exit 1
          fi

          apks="$(gh release view "$tag" --json assets \
            --jq '[.assets[].name | select(endswith(".apk"))] | length' 2>/dev/null || echo 0)"
          case "$apks" in
            0) echo "fdroid_needed=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "fdroid_needed=false" >> "$GITHUB_OUTPUT"
               echo "$tag already carries its F-Droid APKs; they are never replaced." ;;
            *) echo "::error::$tag carries $apks of its 3 F-Droid APKs. Delete them by hand and re-dispatch."
               exit 1 ;;
          esac

  # Test gate — mirrors appstore-ios.yml, and matters most here: this is the one
  # workflow that tags the repo and publishes a public GitHub Release. CI is
  # workflow_dispatch-only, so without this the suite might never have run for the
  # commit being tagged. Gates the dry run (`publish: false`) too, deliberately —
  # a dry run that skips the tests wouldn't be a rehearsal of anything.
  test:
    uses: ./.github/workflows/_test.yaml

  build-appimage:
    needs: test
    name: Build AppImage
    # REQUIRED: build on 22.04 (glibc 2.35) for broad distro compatibility — an
    # AppImage requires host glibc >= build glibc, so a 24.04 build (glibc 2.39)
    # would refuse to start on older hosts. Same constraint/reason as
    # snapcraft.yml's core22 pin. Do not bump to ubuntu-latest.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # Pinned to match ci.yaml / snapcraft.yml (no .flutter-version file).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # Full union, spelled out so nothing is silently dropped:
      #  - snapcraft.yml's set MINUS execstack (strict-confinement-only; AppImage
      #    is unconfined) — libcurl4-openssl-dev stays (load-bearing for the
      #    sentry-native link inside `flutter build linux`, not AppImage-specific).
      #  - AppImage extras: dpkg-dev (dpkg-architecture, a hard gtk-plugin dep);
      #    librsvg2-* (SVG gdk-pixbuf loader); libglib2.0-bin/libgdk-pixbuf2.0-bin/
      #    libgtk-3-bin (glib-compile-schemas + the query tools, else the bundle
      #    silently degrades); gobject-introspection + libgirepository1.0-dev;
      #    gsettings-desktop-schemas; desktop-file-utils + appstream (validators);
      #    patchelf; dbus (silences a gtk-plugin color-scheme probe warning).
      # FUSE/libfuse2 is NOT needed — APPIMAGE_EXTRACT_AND_RUN=1 is set in the script.
      - name: Install Linux build + AppImage deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libsecret-1-dev libcurl4-openssl-dev \
            dpkg-dev librsvg2-dev librsvg2-common \
            libglib2.0-bin libgdk-pixbuf2.0-bin libgtk-3-bin \
            gobject-introspection libgirepository1.0-dev \
            gsettings-desktop-schemas desktop-file-utils appstream patchelf dbus

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Single source for the asset filename AND the git tag: 5.1.4+7 -> 5.1.4.
      - name: Resolve version
        id: ver
        run: |
          raw="$(grep -m1 '^version:' pubspec.yaml)"
          v="${raw#*version:}"; v="${v//[\"\' ]/}"; v="${v%%+*}"; v="${v%$'\r'}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "AppImage version: $v"

      # Diagnostic only (non-fatal) — surfaces metainfo warnings in the log so we
      # can later drop LDAI_NO_APPSTREAM=1. Validates the committed source, not the
      # version-stamped AppDir copy (packaging skips validation anyway).
      - name: Validate desktop + AppStream metadata (non-fatal)
        run: |
          desktop-file-validate appimage/com.invoiceninja.admin.desktop || true
          appstreamcli validate appimage/com.invoiceninja.admin.metainfo.xml || true

      # IN_SENTRY_DSN is baked into the binary here (compile-time
      # String.fromEnvironment, inside `flutter build linux`); empty/unset is a
      # safe no-op (Env.sentryDsn defaults to '' -> Sentry disabled). The script
      # owns `flutter build linux` + packaging; pub get + codegen ran above.
      - name: Build AppImage
        env:
          IN_SENTRY_DSN: ${{ secrets.IN_SENTRY_DSN }}
          APPIMAGE_VERSION: ${{ steps.ver.outputs.version }}
        run: tools/build_appimage.sh

      # Cheap validity check — no GUI/GL needed (full launch isn't headless-friendly).
      - name: Smoke-check the AppImage
        run: |
          cd build/appimage
          APPIMAGE_EXTRACT_AND_RUN=1 ./InvoiceNinja-${{ steps.ver.outputs.version }}-x86_64.AppImage --appimage-extract >/dev/null
          test -f squashfs-root/usr/bin/admin
          test -f squashfs-root/usr/bin/lib/libapp.so
          test -f squashfs-root/usr/bin/data/icudtl.dat
          test -x squashfs-root/usr/bin/lib/crashpad_handler  # must be +x or Sentry crashes the app at startup (posix_spawn EACCES)
          if ldd squashfs-root/usr/bin/admin | grep -i 'not found'; then
            echo "ERROR: unresolved shared libraries in the bundled executable" >&2
            exit 1
          fi

      # Always upload (even on dry runs) so the artifact is downloadable from the run.
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceNinja-AppImage
          path: build/appimage/InvoiceNinja-*-x86_64.AppImage
          if-no-files-found: error

  # The F-Droid APKs, built twice per ABI by `fdroid build` in F-Droid's own
  # image: `build` is what gets signed, `rebuild` runs on 2 CPUs with another
  # timezone, umask and hostname, so the comparison below proves the first did
  # not depend on them. Starts beside the test gate rather than after it —
  # nothing here publishes, and the builds are the long pole.
  fdroid-build:
    needs: preflight
    if: needs.preflight.outputs.fdroid_needed == 'true'
    name: F-Droid ${{ matrix.variant }} (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86_64]
        variant: [build, rebuild]
    steps:
      - uses: actions/checkout@v5

      # The image, a full Flutter clone, the NDK, Gradle caches and the build
      # outgrow the runner's free disk. The build never touches the host's
      # toolchains (the image brings its own), so drop the big ones.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: fdroid build
        run: >-
          tools/fdroid_build.sh build ${{ matrix.abi }} --commit ${{ github.sha }}
          ${{ matrix.variant == 'rebuild' && '--vary' || '' }}

      - name: Upload the unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-unsigned-${{ matrix.abi }}-${{ matrix.variant }}
          path: build/fdroid/${{ matrix.abi }}${{ matrix.variant == 'rebuild' && '-vary' || '' }}/out/
          if-no-files-found: error

  # Signs the `build` APKs on the host — the third-party image never shares a
  # job with the key. The secrets live in the `fdroid-signing` Environment,
  # limited to main, so a pushed branch cannot dispatch a workflow that reads
  # them. Without them the APKs are signed with an ephemeral key: good enough
  # to prove the signature copies across, never published.
  fdroid-sign:
    needs: [preflight, fdroid-build]
    name: Sign F-Droid APKs
    runs-on: ubuntu-latest
    environment: fdroid-signing
    steps:
      - uses: actions/checkout@v5

      - name: Download the unsigned APKs
        uses: actions/download-artifact@v4
        with:
          pattern: fdroid-unsigned-*-build
          path: build/fdroid-unsigned

      - name: Sign
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for abi in armeabi-v7a arm64-v8a x86_64; do
            tools/fdroid_build.sh sign "$abi" \
              build/fdroid-unsigned/fdroid-unsigned-$abi-build/com.invoiceninja.admin_*.apk \
              build/fdroid-signed
          done

      # tools/fdroid_build.sh deletes the decoded keystore itself; this covers a
      # run killed mid-step.
      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP"/fdroid-sign.*

      - name: Upload the signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-signed
          path: build/fdroid-signed/
          if-no-files-found: error

  # F-Droid's own publish check, per ABI: copy the signature onto an unsigned
  # APK and verify it. Against our own build first (signing preserved every
  # byte), then against the varied rebuild (the build is reproducible).
  fdroid-compare:
    needs: [fdroid-build, fdroid-sign]
    name: F-Droid verify (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v5

      - name: Download the APKs
        uses: actions/download-artifact@v4
        with:
          pattern: fdroid-*
          path: build/fdroid-artifacts

      - name: The signature copies onto our own unsigned build
        run: >-
          tools/fdroid_build.sh compare
          build/fdroid-artifacts/fdroid-signed/InvoiceNinja-*-${{ matrix.abi }}.apk
          build/fdroid-artifacts/fdroid-unsigned-${{ matrix.abi }}-build/com.invoiceninja.admin_*.apk

      - name: The signature copies onto the varied rebuild
        run: >-
          tools/fdroid_build.sh compare
          build/fdroid-artifacts/fdroid-signed/InvoiceNinja-*-${{ matrix.abi }}.apk
          build/fdroid-artifacts/fdroid-unsigned-${{ matrix.abi }}-rebuild/com.invoiceninja.admin_*.apk

      # Mismatch runbook: docs/fdroid.md § The reproducibility gate. The two
      # unsigned APKs are this run's artifacts, ready for diffoscope.
      - name: Toolchain differences between the two builds
        if: failure()
        run: >-
          diff build/fdroid-artifacts/fdroid-unsigned-${{ matrix.abi }}-build/toolchain.txt
          build/fdroid-artifacts/fdroid-unsigned-${{ matrix.abi }}-rebuild/toolchain.txt || true

  # One Release per version, carrying the AppImage and the three APKs. A new
  # Release is created as a draft with every asset and only then published, so
  # the tag never exists without its APKs. Gated on the boolean input (never
  # bare github.event.inputs.publish — the string "false" is truthy).
  publish:
    needs: [preflight, build-appimage, fdroid-build, fdroid-sign, fdroid-compare]
    if: >-
      always() && inputs.publish
      && needs.preflight.result == 'success'
      && needs.build-appimage.result == 'success'
      && (needs.preflight.outputs.fdroid_needed == 'false'
          || needs.fdroid-compare.result == 'success')
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.preflight.outputs.version }}
      ATTACH_APKS: ${{ needs.preflight.outputs.fdroid_needed }}
    steps:
      - name: Download the AppImage
        uses: actions/download-artifact@v4
        with:
          name: InvoiceNinja-AppImage
          path: assets

      - name: Download the signed APKs
        if: env.ATTACH_APKS == 'true'
        uses: actions/download-artifact@v4
        with:
          name: fdroid-signed
          path: fdroid-signed

      - name: Publish
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if [ "$ATTACH_APKS" = true ]; then
            # Every APK must carry the pinned key, not the ephemeral one.
            signed="$(grep -l '^publishable=true$' fdroid-signed/*.signing | wc -l || true)"
            if [ "$signed" != 3 ]; then
              echo "::error::The F-Droid APKs were signed with an ephemeral key: the fdroid-signing Environment has no FDROID_* secrets (docs/store-deployment-setup.md § F-Droid signing key)."
              exit 1
            fi
            cp fdroid-signed/*.apk assets/
          fi
          ls -l assets
          if gh release view "$tag" >/dev/null 2>&1; then
            # Re-dispatch: replace the AppImage in place; preflight guaranteed
            # no APK is attached yet, so these uploads never clobber one.
            gh release upload "$tag" assets/*.AppImage --clobber
            if [ "$ATTACH_APKS" = true ]; then gh release upload "$tag" assets/*.apk; fi
          else
            gh release create "$tag" assets/* --draft --prerelease \
              --target "$GITHUB_SHA" --title "Invoice Ninja $VERSION" --generate-notes
            # A draft has no tag yet, so it is found by listing, not by tag.
            id="$(gh api "repos/$GH_REPO/releases?per_page=100" \
              --jq "[.[] | select(.draft and .tag_name == \"$tag\")][0].id")"
            test -n "$id" && test "$id" != null
            gh api -X PATCH "repos/$GH_REPO/releases/$id" -F draft=false >/dev/null
            gh release view "$tag" --json url,isDraft,isPrerelease,assets \
              --jq '{url, isDraft, isPrerelease, assets: [.assets[].name]}'
          fi
